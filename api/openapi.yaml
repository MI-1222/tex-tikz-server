openapi: 3.1.0
info:
  title: TikZ Rendering Service API
  description: High-performance TikZ/LaTeX rendering service.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /health:
    get:
      summary: Health check endpoint
      description: サーバーの稼働状態を確認するヘルスチェックエンドポイント。
      operationId: checkHealth
      responses:
        '200':
          description: サーバーが正常に稼働中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: 内部サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: サービス利用不可
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/render/tikz:
    post:
      summary: Render TikZ code to SVG
      description: 入力された TikZ コードをコンパイルし、SVG 形式のベクター画像として返す。
      operationId: renderTikz
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderTikzRequest'
      responses:
        '200':
          description: TikZ のコンパイルおよび SVG 生成に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderTikzResponse'
        '400':
          description: 不正なリクエストボディまたは空のコード
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 認証失敗(無効または欠落した API キー)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: TeX / TikZ コンパイルエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompileErrorResponse'
        '504':
          description: コンパイル処理の実行タイムアウト
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API キー認証ヘッダー。

  schemas:
    HealthResponse:
      type: object
      description: ヘルスチェックのレスポンススキーマ。
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: ok
          description: サーバーのステータス。
        version:
          type: string
          example: 0.0.2
          description: APIのバージョン情報。

    RenderTikzRequest:
      type: object
      description: TikZ レンダリングリクエストスキーマ。
      required:
        - code
      properties:
        code:
          type: string
          description: "TikZ コードブロック(例: \\begin{tikzpicture}...\\end{tikzpicture})。"
          example: "\\begin{tikzpicture}\n  \\draw (0,0) circle (1cm);\n  \\node at (0,0) {日本語};\n\\end{tikzpicture}"
        format:
          type: string
          enum: [svg]
          default: svg
          description: 出力ベクターフォーマット。
        preamble:
          type: string
          description: 追加の LaTeX パッケージまたは TikZ ライブラリ指定。
          example: "\\usetikzlibrary{arrows.meta}"
        timeout_ms:
          type: integer
          minimum: 1000
          maximum: 15000
          default: 10000
          description: クライアント指定のタイムアウト時間(ミリ秒)。

    RenderTikzResponse:
      type: object
      description: TikZ レンダリング成功レスポンススキーマ。
      required:
        - status
        - format
        - svg
        - cached
        - hash
        - compile_time_ms
      properties:
        status:
          type: string
          example: success
          description: 処理ステータス。
        format:
          type: string
          example: svg
          description: 出力フォーマット。
        svg:
          type: string
          description: 生成された SVG XML 文字列。
          example: "<svg xmlns=\"http://www.w3.org/2000/svg\" ...>...</svg>"
        cached:
          type: boolean
          description: キャッシュから取得されたかどうかのフラグ。
          example: false
        hash:
          type: string
          description: 入力コード等の SHA-256 キャッシュキー。
          example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        compile_time_ms:
          type: integer
          description: コンパイル処理にかかった時間(ミリ秒)。
          example: 342

    ErrorResponse:
      type: object
      description: 共通エラーレスポンススキーマ。
      required:
        - status
        - error_code
        - message
      properties:
        status:
          type: string
          example: error
          description: エラーステータス。
        error_code:
          type: string
          example: INVALID_REQUEST
          description: エラー分類コード。
        message:
          type: string
          example: "Missing required parameter: code"
          description: エラーメッセージの詳細。

    CompileErrorResponse:
      type: object
      description: TeX コンパイルエラーレスポンススキーマ。
      required:
        - status
        - error_code
        - message
        - log
      properties:
        status:
          type: string
          example: error
          description: エラーステータス。
        error_code:
          type: string
          example: COMPILATION_FAILED
          description: エラー分類コード。
        message:
          type: string
          example: "uplatex compilation failed"
          description: エラーメッセージの詳細。
        log:
          type: string
          description: LaTeX コンパイルログの末尾抜粋。
          example: "! Package pgfkeys Error: I do not know the key '/tikz/invalid_key'..."
